name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attach extension packages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Read version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"

          # The manifest version comes from package.json, so the release tag has to agree with it.
          if [ -n "${TAG}" ] && [ "${TAG#v}" != "${version}" ]; then
            echo "::error::Release tag ${TAG} does not match package.json version ${version}. Bump the version first."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building version ${version}."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      # Builds both browsers and writes the store zips plus the source zip to release/.
      - name: Build and package
        run: pnpm package

      # Chromium and Firefox builds, plus the source zip AMO reviewers use to rebuild the Firefox package.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-packages-${{ steps.version.outputs.version }}
          path: release/*.zip
          if-no-files-found: error

      - name: Attach packages to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release/*.zip
          fail_on_unmatched_files: true
